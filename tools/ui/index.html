<title>Trade Debate Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: calm cards app. Phone: top bar + bottom tab bar. Desktop (>=900px): left side menu + one reading column.
   Five views by hash: #now #debates #markets #journal #settings. Light Claude palette (ivory, clay), single theme by choice. */
:root{
  color-scheme: light;
  --page:#faf9f5; --card:#ffffff; --soft:#f3f1ea; --ink:#141413; --ink-2:#3d3c37; --muted:#77756c; --line:#e7e4d9;
  --clay:#d97757; --clay-ink:#b4532f; --clay-soft:#fbeee8;
  --good:#4f6b2c; --good-soft:#eef3e4; --bad:#a8463b; --bad-soft:#fbeceb; --warn:#8f6400; --warn-soft:#fbf3dc; --info:#3b6894; --info-soft:#eaf1f8;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-read:"Lora",Georgia,serif; --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.app{grid-template-columns:232px minmax(0,1fr)}}

/* side menu (desktop) */
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--page)}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--clay);color:#fff;display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px}
.brand b{font-weight:600;font-size:15px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-size:14px;font-weight:500}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--soft)}
.nav[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 12px;line-height:1.5}

/* top bar + bottom tabs (phone) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);display:flex;align-items:center;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.topbar .mark{width:30px;height:30px;border-radius:10px}
.topbar b{font-weight:600;font-size:15px}
.topbar .dot{margin-left:auto}
@media (min-width:900px){.topbar{display:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,249,245,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:500}
.tabs svg{width:21px;height:21px}
.tabs a[aria-current="page"]{color:var(--clay-ink)}
@media (min-width:900px){.tabs{display:none}}

/* content */
main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding:32px 40px 48px}}
.col{max-width:760px;margin:0 auto;display:grid;gap:16px}
.view{display:grid;gap:16px}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
.lead{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:18px}
.soft{background:var(--soft);border-radius:var(--r);padding:16px}
.label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-take{background:var(--good-soft);color:var(--good)} .p-skip{background:var(--bad-soft);color:var(--bad)} .p-live{background:var(--clay-soft);color:var(--clay-ink)}
.p-ok{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-down{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}

/* status strip */
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.status{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:12px;color:var(--muted)}

/* hero */
.hero{display:grid;gap:12px}
.hero .big{font-size:22px;font-weight:600;line-height:1.25;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);font-family:var(--f-read);font-size:15.5px}
.ticket{background:var(--ink);color:var(--page);border-radius:12px;padding:12px 14px;font:400 13px/1.6 var(--f-num);display:grid;gap:2px}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:flex;gap:10px;font-size:14px;color:var(--ink-2)}
.why li > span:first-child{flex:none;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-top:8px}
details summary{cursor:pointer;list-style:none;font-size:14px;font-weight:500;color:var(--clay-ink)}
details summary::-webkit-details-marker{display:none}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft);border-radius:12px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.02em}
.m-crypto{background:#fdf0e4;color:#9a541c} .m-us{background:var(--info-soft);color:var(--info)} .m-nse{background:#f3ecf8;color:#6b4a8a} .m-forex{background:var(--good-soft);color:var(--good)}
.item h3{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{display:grid;justify-items:end;gap:4px}
.end time{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--page);box-shadow:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.tile{background:var(--soft);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.tile small{font-size:12px;color:var(--muted)}
.tile b{font-size:18px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.kv{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.kv li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv li:last-child{border-bottom:0}
.kv li span:first-child{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}
.chart{width:100%;height:140px;display:block}
.note{font-size:12px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--line)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease both}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="app">
  <aside class="side" aria-label="Main menu">
    <div class="brand"><span class="mark" id="m1"></span><div><b>Trade Desk</b><small>Bull vs Bear, Judge decides</small></div></div>
    <nav id="sidenav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div style="min-width:0">
    <header class="topbar"><span class="mark" id="m2"></span><b>Trade Desk</b><span class="dot" id="topdot"></span></header>
    <main><div class="col" id="view"></div></main>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<script id="index-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("index-data").textContent);
  var items = D.debates || [];
  var IC = {

    debates: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11v8H8l-4 3zM15 9h5v8l-3-2h-6v-2"/></svg>',
    markets: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>',
    journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a1 1 0 011 1v16a1 1 0 01-1 1H6zM6 3a2 2 0 00-2 2v14a2 2 0 002 2M9 8h6M9 12h6"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
    mark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11v8H8l-4 3zM15 9h5v8l-3-2h-6v-2"/></svg>'
  };
  var VIEWS = [["now", "Now"], ["debates", "Debates"], ["markets", "Markets"], ["journal", "Journal"], ["settings", "Settings"]];
  var MK = {crypto: "Crypto", us: "US stocks", nse: "NSE", forex: "Forex"};
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function n(x, d) { return typeof x === "number" ? x.toLocaleString(undefined, {maximumFractionDigits: d == null ? (Math.abs(x) >= 100 ? 2 : 4) : d}) : "–"; }
  function pct(x) { return typeof x === "number" ? '<span class="num ' + (x >= 0 ? "up" : "down") + '">' + (x >= 0 ? "+" : "") + x.toFixed(2) + "%</span>" : "–"; }
  function ago(iso) {
    var t = new Date(iso); if (isNaN(t)) return "–";
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
  }
  function when(iso) { var d = new Date(iso); if (isNaN(d)) return ""; return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : d.toLocaleDateString([], {day: "numeric", month: "short"}); }
  function callOf(x) { return x.decision === "LIVE" ? "LIVE" : (x.final_call || x.decision); }
  function pillFor(c, conf) {
    var cls = c === "TAKE" ? "p-take" : c === "LIVE" ? "p-live" : "p-skip";
    return '<span class="pill ' + cls + '">' + esc(c === "LIVE" ? "Live" : c) + (conf != null && c !== "LIVE" ? ' <span class="num">' + esc(conf) + "%</span>" : "") + "</span>";
  }
  function sym(x) { return String(x.symbol || "").split("/")[0]; }

  /* next scheduled scan from the UTC schedule */
  function nextRun() {
    var S = D.schedule_utc; if (!S) return null;
    var now = new Date(), best = null;
    for (var dd = 0; dd < 3; dd++) {
      var day = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + dd));
      var wk = day.getUTCDay(), list = (wk === 0 || wk === 6) ? S.weekends : S.weekdays;

  }
  function lastScan() { return (D.scan_result && D.scan_result.scanned_utc) || (D.scan && D.scan.scanned_utc) || null; }
  function healthPill() {
    var h = D.health && D.health.status;
    return h === "OK" ? ["p-ok", "Data OK"] : h === "DOWN" ? ["p-down", "Data down"] : h ? ["p-warn", "Data partly down"] : ["p-info", "Data unknown"];
  }

  /* ---------- views ---------- */
  function statusStrip() {
    var hp = healthPill(), ls = lastScan(), nr = nextRun();
    var stale = ls && (Date.now() - new Date(ls)) > 8 * 3600000;
    var b = D.budget;
    return '<section class="status" aria-label="System status">' +
      '<div class="stat"><small>Data sources</small><b><span class="pill ' + hp[0] + '">' + hp[1] + "</span></b></div>" +
      '<div class="stat"><small>Last scan</small><b class="' + (stale ? "down" : "") + '">' + esc(ls ? ago(ls) : "none yet") + "</b></div>" +
      '<div class="stat"><small>Next scan</small><b>' + esc(nr ? nr.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) + (nr.toDateString() !== new Date().toDateString() ? " " + nr.toLocaleDateString([], {weekday: "short"}) : "") : "–") + "</b></div>" +
      '<div class="stat"><small>Debates left today</small><b>' + (b ? '<span class="num">' + Math.max(0, b.max - b.used) + "</span> of " + b.max : "–") + "</b></div></section>" +
      (stale ? '<p class="note" style="color:var(--bad)">The last scheduled scan was over 8 hours ago. A run may have failed (for example, the Claude usage limit). Check the routines page.</p>' : "");
  }
  function heroCard() {
    var dayAgo = Date.now() - 24 * 3600000;
    var takes = items.filter(function (x) { return callOf(x) === "TAKE" && new Date(x.created_utc) > dayAgo && (x.outcome === "pending" || !x.outcome); });
    if (takes.length) {
      return takes.map(function (x) {
        return '<section class="card hero"><div class="between"><span class="label">Right now</span>' + pillFor("TAKE", x.confidence) + "</div>" +
          '<div class="big">' + esc(x.direction + " " + x.symbol) + "</div><p>" + esc(x.headline || "") + "</p>" +
          (x.ticket ? '<div class="ticket">' + x.ticket.map(function (l) { return "<span>" + esc(l) + "</span>"; }).join("") + "</div>" : "") +
          '<a class="btn" href="' + esc(x.href) + '">Open the full debate →</a></section>';
      }).join("");
    }
    var sr = D.scan_result, skipped = (sr && sr.skipped) || [];
    var recent = items.filter(function (x) { return x.decision !== "LIVE"; }).slice(0, 3);
    var reasons = {};
    skipped.forEach(function (s) { reasons[s.reason] = (reasons[s.reason] || 0) + 1; });
    var top = Object.keys(reasons).sort(function (a, b) { return reasons[b] - reasons[a]; }).slice(0, 3);
    return '<section class="card hero"><div class="between"><span class="label">Right now</span><span class="pill p-skip">No trade</span></div>' +
      '<div class="big">Nothing worth taking</div>' +
      "<p>" + (skipped.length ? "The last scan checked " + skipped.length + " ideas and none passed your rules." : "No recent trade passed every check.") +

      (skipped.length ? '<details><summary>See every idea that was filtered out</summary><div class="list" style="margin-top:8px">' +

      "</section>";
  }
  function watching() {

      }).join("") + "</div></section>";
  }
  function debateRow(x) {
    var line = x.decision === "LIVE" ? "In progress: " + (x.progress || "") : (x.headline || x.preview || "");

      "<div><h3>" + esc(x.direction + " " + x.symbol) + '</h3><p>' + esc(line) + res + "</p></div>" +

  }
  function viewNow() {

      (live.length ? '<section class="card"><h2>Debating now</h2><div class="list" style="margin-top:6px">' + live.map(debateRow).join("") + "</div></section>" : "") +
      '<section class="card"><div class="between"><h2>Recent debates</h2><a class="btn" href="#debates">All</a></div><div class="list" style="margin-top:6px">' +
      (recent.length ? recent.map(debateRow).join("") : '<p class="empty">No debates yet.</p>') + "</div></section>" + miniStats();
  }

  var F = "all";
  function viewDebates() {
    var list = items.filter(function (x) {
      var c = callOf(x);
      return F === "all" || F === c || F === x.market;
    });
    var fl = [["all", "All"], ["TAKE", "Take"], ["SKIP", "Skip"], ["LIVE", "Live"], ["crypto", "Crypto"], ["us", "US"], ["nse", "NSE"], ["forex", "Forex"]];
    return '<header><h1>Debates</h1><p class="lead">Each one is a group chat: Bull Claude for the trade, Bear Claude against, the Judge decides.</p></header>' +
      '<div class="chips" role="toolbar" aria-label="Filter">' + fl.map(function (f) { return '<button class="chip" data-f="' + f[0] + '" aria-pressed="' + (F === f[0]) + '">' + f[1] + "</button>"; }).join("") + "</div>" +
      '<section class="card" style="padding:8px 14px"><div class="list">' + (list.length ? list.map(debateRow).join("") : '<p class="empty" style="padding:12px 0">No debates match this filter.</p>') + "</div></section>";
  }

  function viewMarkets() {
    var B = D.brief;
    if (!B) return '<header><h1>Markets</h1></header><section class="card"><p class="empty">The morning brief has not run yet. It runs before NSE (08:45 IST) and US (19:30 IST) opens on weekdays.</p></section>';
    var mood = (B.mood || []).map(function (m) {
      return (m.indexes || []).map(function (i) {
        return '<div class="tile"><small>' + esc(i.name) + '</small><b class="num">' + n(i.price) + "</b><span>" + pct(i.change_today_pct) + ' <span class="note" style="display:inline">' + esc(i.trend === "UP" ? "uptrend" : i.trend === "DOWN" ? "downtrend" : "no clear trend") + "</span></span></div>";
      }).join("");
    }).join("");
    var ev = (B.events || []).map(function (e) { return "<li><span>" + esc(new Date(e.time_utc).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})) + "</span><span>" + esc(e.title) + " · " + esc(e.currency) + (e.tier === 1 ? ' <span class="pill p-warn">major</span>' : "") + "</span></li>"; }).join("");
    var ov = (B.overnight || []).map(function (o) { return '<div class="tile"><small>' + esc(o.symbol) + '</small><b class="num">' + n(o.price) + "</b>" + pct(o.change_pct) + "</div>"; }).join("");
    var wl = (B.watchlist || []).map(function (w) {
      return '<div class="item" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="av m-' + esc(w.market) + '">' + esc(String(w.symbol).split("/")[0].slice(0, 5)) + "</span><div><h3>" + esc(w.symbol) + ' <span class="num" style="font-weight:400">' + n(w.price) + "</span></h3><p>Floor " + n(w.floor) + " · ceiling " + n(w.ceiling) + (w.note ? " · " + esc(w.note) : "") + "</p></div><span class=\"pill " + (w.volatility === "HIGH" || w.volatility === "EXTREME" ? "p-warn" : "p-ok") + '">' + esc(w.volatility || "") + "</span></div>";
    }).join("");
    return '<header><h1>Markets</h1><p class="lead">From the brief, ' + esc(ago(B.computed_utc)) + '. <a href="brief.html" style="color:var(--clay-ink)">Open full brief →</a></p></header>' +
      '<section class="card"><h2>Mood</h2><div class="grid3" style="margin-top:10px">' + (mood || '<p class="empty">No data.</p>') + "</div></section>" +
      '<section class="card"><h2>Big events, next 24 hours</h2>' + (ev ? '<ul class="kv" style="margin-top:6px">' + ev + "</ul>" : '<p class="empty" style="margin-top:6px">No major events. A calmer day is likely.</p>') + "</section>" +
      '<section class="card"><h2>Overnight</h2><div class="grid3" style="margin-top:10px">' + ov + "</div></section>" +
      '<section class="card"><h2>Your watchlist</h2><div class="list" style="margin-top:4px">' + (wl || '<p class="empty" style="padding:8px 0">No active entries. Turn some on in config/watchlist.json, or ask Claude to add them.</p>') + "</div></section>";
  }

  function curve(p) {
    var a = (p.desk && p.desk.curve) || [], b = (p.take_everything && p.take_everything.curve) || [];
    var all = a.concat(b).map(function (c) { return c.balance; });
    if (all.length < 2) return '<p class="empty">The chart appears once trades have results.</p>';
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), pad = (hi - lo) * 0.1 || 1;
    lo -= pad; hi += pad;
    function path(c, len) { return c.map(function (pt, i) { var x = 10 + i * (300 / Math.max(1, len - 1)), y = 10 + (1 - (pt.balance - lo) / (hi - lo)) * 110; return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }).join(" "); }
    var len = Math.max(a.length, b.length);
    var y0 = 10 + (1 - (p.start_capital - lo) / (hi - lo)) * 110;
    return '<svg class="chart" viewBox="0 0 320 130" role="img" aria-label="Practice account balance over trades"><line x1="10" x2="310" y1="' + y0.toFixed(1) + '" y2="' + y0.toFixed(1) + '" stroke="#e7e4d9" stroke-dasharray="4 4"/>' +
      (b.length > 1 ? '<path d="' + path(b, len) + '" fill="none" stroke="#c9c6ba" stroke-width="2"/>' : "") +
      (a.length > 1 ? '<path d="' + path(a, len) + '" fill="none" stroke="#d97757" stroke-width="2.5"/>' : "") + "</svg>" +
      '<div class="row" style="gap:16px;font-size:12px;color:var(--muted)"><span><span class="dotc" style="background:#d97757"></span> Following the desk</span><span><span class="dotc" style="background:#c9c6ba"></span> Taking every idea</span></div>';
  }
  function viewJournal() {
    var t = D.track || {}, tk = t.take || {}, sk = t.skip || {}, cal = D.calibration || {}, p = D.paper || {}, q = (D.quality && D.quality.agents) || {};
    var res = items.filter(function (x) { return x.outcome && x.outcome !== "pending"; });
    return '<header><h1>Journal</h1><p class="lead">What really happened after each decision, after costs. It needs dozens of trades before it proves anything.</p></header>' +
      '<section class="grid3"><div class="tile"><small>TAKE calls won / lost</small><b class="num"><span class="up">' + (tk.wins || 0) + '</span> / <span class="down">' + (tk.losses || 0) + "</span></b></div>" +
      '<div class="tile"><small>Good skips</small><b class="num up">' + (sk.losses || 0) + "</b></div>" +
      '<div class="tile"><small>Missed winners</small><b class="num" style="color:var(--warn)">' + (sk.wins || 0) + "</b></div></section>" +
      '<section class="card"><div class="between"><h2>Practice account</h2><span class="num" style="font-weight:600">' + esc(p.currency || "") + " " + n(p.desk ? p.desk.balance : null, 0) + "</span></div>" +
      '<p class="note" style="margin:4px 0 10px">' + esc(p.plain || "") + "</p>" + curve(p) + "</section>" +
      '<section class="card"><h2>Results</h2><div class="list" style="margin-top:6px">' + (res.length ? res.map(function (x) {
        var good = (callOf(x) === "SKIP") === ((x.outcome_r || 0) <= 0);
        return '<a class="item" href="' + esc(x.href) + '"><span class="av m-' + esc(x.market) + '">' + esc(sym(x).slice(0, 5)) + "</span><div><h3>" + esc(x.direction + " " + x.symbol) + "</h3><p>" + esc(callOf(x)) + " · " + esc({target: "target hit", stop: "stop hit", expired: "time ran out", not_filled: "never filled"}[x.outcome] || x.outcome) + "</p></div>" +
          '<div class="end"><span class="num ' + ((x.outcome_r || 0) >= 0 ? "up" : "down") + '">' + (x.outcome_r != null ? (x.outcome_r >= 0 ? "+" : "") + x.outcome_r + "R" : "–") + '</span><span class="pill ' + (good ? "p-ok" : "p-warn") + '">' + (good ? "Right call" : "Missed") + "</span></div></a>";
      }).join("") : '<p class="empty">No results yet.</p>') + "</div></section>" +
      '<section class="card"><h2>How the agents are doing</h2><ul class="kv" style="margin-top:6px">' +
      "<li><span>The Judge</span><span>" + esc(cal.plain || "–") + "</span></li>" +
      ["bull", "bear"].map(function (s) { var a = q[s] || {}; return "<li><span>" + (s === "bull" ? "Bull Claude" : "Bear Claude") + "</span><span>" + (a.accuracy_pct != null ? a.accuracy_pct + "% of checked claims correct, " + (a.numbers_wrong || 0) + " wrong numbers caught" : "–") + "</span></li>"; }).join("") +
      "</ul>" + ((cal.advice || []).length ? '<p class="note" style="margin-top:8px">' + esc(cal.advice.join(" ")) + "</p>" : "") + "</section>";
  }

  function viewSettings() {
    var S = D.settings || {};
    return '<header><h1>Settings</h1><p class="lead">The rules the desk follows. Change them by asking Claude, for example “/trade-settings my NSE capital is 2 lakh”.</p></header>' +
      '<section class="card"><h2>Your rules</h2><ul class="kv" style="margin-top:6px">' + (S.summary || []).map(function (l) { var i = l.indexOf(":"); return i > 0 ? "<li><span>" + esc(l.slice(0, i)) + "</span><span>" + esc(l.slice(i + 1)) + "</span></li>" : "<li><span>" + esc(l) + "</span></li>"; }).join("") + "</ul></section>" +
      '<section class="card"><h2>Brokers and costs</h2><p class="note" style="margin:4px 0 6px">Copied from each broker’s official pricing page. Every reward-to-risk number on this site is after these costs.</p><ul class="kv">' +
      (D.costs || []).map(function (c) { return "<li><span>" + esc(c.market) + '</span><span style="text-align:right">' + esc(c.source) + "</span></li>"; }).join("") + "</ul></section>" +
      '<section class="card"><h2>Schedule</h2><ul class="kv" style="margin-top:6px"><li><span>Market scans</span><span>' + esc(D.schedule || "–") + "</span></li><li><span>Morning briefs</span><span>Weekdays 08:45 and 19:30 IST</span></li></ul></section>" +
      '<p class="note" style="text-align:center">AI analysis of free public data. Not financial advice. The desk never places orders.</p>';
  }

  /* ---------- shell ---------- */
  function route() { var h = (location.hash || "#now").slice(1); return VIEWS.some(function (v) { return v[0] === h; }) ? h : "now"; }
  function render() {
    var r = route();
    document.getElementById("view").innerHTML = '<div class="view">' + ({now: viewNow, debates: viewDebates, markets: viewMarkets, journal: viewJournal, settings: viewSettings}[r])() + "</div>";
    var nav = VIEWS.map(function (v) { return '<a class="nav" href="#' + v[0] + '"' + (v[0] === r ? ' aria-current="page"' : "") + ">" + IC[v[0]] + v[1] + "</a>"; }).join("");
    document.getElementById("sidenav").innerHTML = nav;
    document.getElementById("tabs").innerHTML = VIEWS.map(function (v) { return '<a href="#' + v[0] + '"' + (v[0] === r ? ' aria-current="page"' : "") + ">" + IC[v[0]] + v[1] + "</a>"; }).join("");
    var hp = healthPill();
    document.getElementById("topdot").innerHTML = '<span class="pill ' + hp[0] + '">' + hp[1] + "</span>";
    document.getElementById("sidefoot").innerHTML = "Updated " + esc(ago(D.generated_utc)) + "<br>" + '<span class="pill ' + hp[0] + '" style="margin-top:6px">' + hp[1] + "</span>";
    document.title = (r === "now" ? "" : VIEWS.find(function (v) { return v[0] === r; })[1] + " · ") + "Trade Debate Desk";
  }
  document.getElementById("m1").innerHTML = IC.mark;
  document.getElementById("m2").innerHTML = IC.mark;
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]"); if (!b) return;
    F = b.dataset.f; render();
  });
  render();
  if (items.some(function (x) { return x.decision === "LIVE"; }) && D.live_reload) setTimeout(function () { location.reload(); }, 60000);
})();
</script>
